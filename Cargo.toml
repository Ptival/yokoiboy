[package]
name = "yokoiboy"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.98"
boolenum = "0.1.0"
ciborium = "0.2.2"
circular-queue = "0.2.7"
clap = { version = "4.5.41", features = ["derive"] }
iced = { git = "https://github.com/iced-rs/iced.git", features = [
  "advanced",
  "image",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
serde-big-array = { version = "0.5.1" }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

[profile.dev]
opt-level = 3
